version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: quantfloww-db-prod
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=QuantFloww@Anubhav123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-prod-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "QuantFloww@Anubhav123!", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    container_name: quantfloww-cache-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-prod-data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantfloww-backend-prod
    restart: always
    ports:
      - "5280:5280"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=QuantFlowwDb;User Id=sa;Password=QuantFloww@Anubhav123!;MultipleActiveResultSets=true;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - CorsSettings__AllowedOrigins=http://localhost:5173,https://your-production-frontend-domain.com
      - JwtSettings__Secret=QuantFlowwSuperSecretKeyForProductionPhase56789012345!
      - JwtSettings__Issuer=QuantFlowwAPI
      - JwtSettings__Audience=QuantFlowwClient
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  sqlserver-prod-data:
  redis-prod-data:
