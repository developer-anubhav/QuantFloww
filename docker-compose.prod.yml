version: '3.8'

services:
  postgres:
    image: postgres:alpine
    container_name: quantfloww-db-prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: QuantFlowwPassword123!
      POSTGRES_DB: quantfloww_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quantfloww_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: quantfloww-cache-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-prod-data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantfloww-backend-prod
    restart: always
    ports:
      - "5280:5280"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=quantfloww_db;Username=postgres;Password=QuantFlowwPassword123!
      - ConnectionStrings__Redis=redis:6379
      - CorsSettings__AllowedOrigins=http://localhost:5173,https://your-production-frontend-domain.com
      - JwtSettings__Secret=QuantFlowwSuperSecretKeyForProductionPhase56789012345!
      - JwtSettings__Issuer=QuantFlowwAPI
      - JwtSettings__Audience=QuantFlowwClient
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres-prod-data:
  redis-prod-data:
